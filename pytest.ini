[pytest]
testpaths = tests
# pytest-asyncio is present in the author's environment and absent in CI, so
# setting its config option silences a warning in one place and RAISES an
# unknown-option warning in the other. Filtering the message works in both.
filterwarnings =
    ignore:.*asyncio_default_fixture_loop_scope.*:DeprecationWarning
    error::DeprecationWarning:chukta.*
    error::DeprecationWarning:sim.*
    error::DeprecationWarning:eval.*
addopts = --strict-markers -q
