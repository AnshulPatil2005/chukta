[pytest]
testpaths = tests
# pytest-asyncio is present in this environment and absent in CI, and it warns
# at plugin-load time - before filterwarnings applies - so the message cannot be
# filtered. Nothing here is async, so the plugin is simply not loaded. `-p no:`
# on an absent plugin is a no-op, which keeps this working in both places.
filterwarnings =
    error::DeprecationWarning:chukta.*
    error::DeprecationWarning:sim.*
    error::DeprecationWarning:eval.*
addopts = --strict-markers -q -p no:asyncio
