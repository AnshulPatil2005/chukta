[pytest]
testpaths = tests
# pytest-asyncio is pulled in by another package in this environment; nothing
# here is async. Pinning the scope silences a deprecation warning that
# otherwise prints on every single run and trains you to ignore warnings.
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::DeprecationWarning:chukta.*
    error::DeprecationWarning:sim.*
    error::DeprecationWarning:eval.*
addopts = --strict-markers -q
